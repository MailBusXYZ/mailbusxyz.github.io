<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Sign in to Mailbus</title>
<meta name="theme-color" content="#F5F6F4">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/site.js" defer></script>
</head>
<body>

<header class="wrap site-header">
  <a class="brand" href="./" aria-label="Mailbus home">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="26" height="17" rx="3"/><path d="M4.5 8.5 16 17l11.5-8.5"/><circle cx="10" cy="27" r="2.4" fill="currentColor" stroke="none"/><circle cx="22" cy="27" r="2.4" fill="currentColor" stroke="none"/></svg>
    <span>mailbus</span>
  </a>
</header>

<main class="wrap centered">
  <div class="panel">
    <h1 class="panel-title">Sign in</h1>

    <!--
      Simulated sign-in. Nothing typed here is sent or stored anywhere:
      the password field has no name attribute, and assets/site.js stops the
      form from submitting and always shows the "not recognised" message.
    -->
    <form class="form" data-signin-form>
      <div class="alert" role="alert" hidden data-signin-error>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></svg>
        <span>We don't recognise that address or password. Check both and try again.</span>
      </div>

      <div class="form-field">
        <label class="field-label" for="signin-address">Email address</label>
        <input class="text-input" id="signin-address" type="text" inputmode="email" placeholder="yourname@mailbus.xyz" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>

      <div class="form-field">
        <label class="field-label" for="signin-password">Password</label>
        <input class="text-input" id="signin-password" type="password" autocomplete="current-password" required>
      </div>

      <button class="button button--wide" type="submit" data-signin-button>Sign in</button>
    </form>

    <p class="panel-foot">New to Mailbus? <a class="text-link" href="index.html#claim">Get your address</a></p>
  </div>
</main>

</body>
</html>
