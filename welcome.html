<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Mailbus is coming soon</title>
<meta name="theme-color" content="#F5F6F4">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/site.js" defer></script>
</head>
<body>

<header class="wrap site-header">
  <a class="brand" href="./" aria-label="Mailbus home">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="26" height="17" rx="3"/><path d="M4.5 8.5 16 17l11.5-8.5"/><circle cx="10" cy="27" r="2.4" fill="currentColor" stroke="none"/><circle cx="22" cy="27" r="2.4" fill="currentColor" stroke="none"/></svg>
    <span>mailbus</span>
  </a>
</header>

<main class="wrap centered">
  <!--
    The address is read from ?address= by assets/site.js and shown only if it
    passes the same check as the form. Without one, the generic text below stays.
  -->
  <div class="panel soon">
    <h1 class="soon-title" data-soon-title>Coming soon.</h1>
    <p class="soon-address" hidden data-soon-address></p>
    <p class="soon-text" data-soon-text>Mailbus isn't open for sign-ups just yet. Check back shortly to choose your address.</p>
    <a class="text-link" href="./">Back to the home page</a>
  </div>
</main>

</body>
</html>
